      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.3"/>
  <!-- Steering / Radar Navigation Icon -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#334155" stroke-width="12" stroke-dasharray="16 16"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.4"/>
  <!-- Forward Arrow -->
